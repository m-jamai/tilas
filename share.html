<header class="page-head">
<h1 class="page-title">Share something for the archive</h1>
<p class="page-intro">A photo, a cassette, a letter, a memory of a place. Tell us where it comes from.</p>
</header>
<!-- GitHub Pages cannot receive form data. Replace the action URL with your form service endpoint (see README). -->
<form class="form" action="https://formspree.io/f/YOUR_FORM_ID" method="post" enctype="multipart/form-data">
<div class="row">
<div class="field"><label for="name">Name</label><input id="name" name="name" type="text" autocomplete="name" required></div>
<div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
</div>
<div class="field">
<label for="what">What are you sharing?</label>
<textarea id="what" name="message" rows="5" aria-describedby="what-hint" required></textarea>
<p class="hint" id="what-hint">What it is, where and when it comes from.</p>
</div>
<div class="field">
<label for="file">File (optional)</label>
<input id="file" name="attachment" type="file" accept="image/*,audio/*,application/pdf">
</div>
<label class="check"><input type="checkbox" name="rights" value="yes" required><span>I have the right to share this.</span></label>
<div><button class="btn" type="submit">Send</button></div>
</form>
</main>
